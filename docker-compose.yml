version: '3.8'

services:
  # Ollama Service
  ollama:
    image: ollama/ollama:latest
    container_name: senpai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - senpai-network
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # CPU Japanese TTS engine. The official stable CPU tag avoids dev/preview builds.
  voicevox:
    image: voicevox/voicevox_engine:cpu-latest
    container_name: senpai-voicevox
    expose:
      - "50021"
    environment:
      - VV_HOST=0.0.0.0
    networks:
      - senpai-network
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: senpai-postgres
    environment:
      POSTGRES_DB: senpai_db
      POSTGRES_USER: senpai
      POSTGRES_PASSWORD: senpai123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - senpai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U senpai -d senpai_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: senpai-backend
    environment:
      - DATABASE_URL=postgresql://senpai:senpai123@postgres:5432/senpai_db
      - SECRET_KEY=your-secret-key-change-in-production
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=gemma:2b
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CHROMA_PERSIST_DIRECTORY=/app/chroma_db
      - REMINDERS_ENABLED=${REMINDERS_ENABLED:-true}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@senpaiai.local}
      - WHISPER_MODEL_SIZE=${WHISPER_MODEL_SIZE:-small}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - WHISPER_MODEL_DIR=/app/models
      - VOICEVOX_URL=${VOICEVOX_URL:-http://voicevox:50021}
      - LISTENING_MEDIA_DIR=/app/media/audio
      - LISTENING_VOICEVOX_SPEAKER_ID=${LISTENING_VOICEVOX_SPEAKER_ID:-1}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - chroma_data:/app/chroma_db
      - models_data:/app/models
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      voicevox:
        condition: service_started
    networks:
      - senpai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: >
      sh -c "
        echo 'Waiting for services...' &&
        sleep 10 &&
        echo 'Pulling Gemma model...' &&
        curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"gemma:2b\"}' &&
        echo 'Pulling embedding model...' &&
        curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"nomic-embed-text\"}' &&
        echo 'Running migrations...' &&
        alembic upgrade head &&
        echo 'Populating sample data...' &&
        python populate_data.py &&
        echo 'Starting server...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: senpai-frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - senpai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: senpai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - senpai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  chroma_data:
  models_data:
    driver: local
  media_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local

networks:
  senpai-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
